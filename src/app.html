<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			window.__devErrors = [];
			window.addEventListener('error', function(e) {
				window.__devErrors.push(e.message + ' @ ' + e.filename + ':' + e.lineno);
				var el = document.getElementById('__dev_err');
				if (!el) { el = document.createElement('pre'); el.id = '__dev_err'; el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:8px;font-size:12px;z-index:9999;white-space:pre-wrap;max-height:40vh;overflow:auto'; document.body.appendChild(el); }
				el.textContent = window.__devErrors.join('\n');
			});
			window.addEventListener('unhandledrejection', function(e) {
				var msg = 'Unhandled rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
				window.__devErrors.push(msg);
				var el = document.getElementById('__dev_err');
				if (!el) { el = document.createElement('pre'); el.id = '__dev_err'; el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:8px;font-size:12px;z-index:9999;white-space:pre-wrap;max-height:40vh;overflow:auto'; document.body.appendChild(el); }
				el.textContent = window.__devErrors.join('\n');
			});
		</script>
	</body>
</html>
